<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PDF Compressor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --ok: #4ade80;
      --warn: #facc15;
      --err: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: var(--text);
    }
    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(15,23,42,0.6);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    header h1 { margin: 0; font-size: 18px; }
    header .subtitle { color: var(--muted); font-size: 12px; margin-top: 2px; }

    .header-actions { display: flex; gap: 8px; align-items: center; }
    .ghost-btn {
      padding: 8px 12px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Initial upload view (no PDF yet) */
    .uploader {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .uploader .card {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .drop {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .drop:hover, .drop.drag { border-color: var(--accent); background: rgba(56,189,248,0.05); }
    .drop strong { color: var(--accent); }
    input[type=file] { display: none; }

    /* Viewer view (after PDF is loaded) */
    .viewer {
      display: grid;
      grid-template-columns: 200px 1fr 320px;
      min-height: 0;
      height: 100%;
    }
    .thumbs {
      border-right: 1px solid var(--border);
      background: rgba(15,23,42,0.5);
      overflow-y: auto;
      padding: 12px;
    }
    .thumb {
      width: 100%;
      margin-bottom: 10px;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 6px;
      overflow: hidden;
      background: #0f172a;
      transition: border-color 0.15s;
      position: relative;
    }
    .thumb:hover { border-color: var(--accent-hover); }
    .thumb.active { border-color: var(--accent); }
    .thumb canvas { display: block; width: 100%; height: auto; pointer-events: none; }
    .thumb .label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.6);
      color: var(--text);
      font-size: 11px;
      text-align: center;
      padding: 2px 0;
      pointer-events: none;
    }
    .thumb .del {
      position: absolute;
      top: 4px; right: 4px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(15,23,42,0.85);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .thumb:hover .del { display: flex; }
    .thumb .del:hover { background: var(--err); color: #0f172a; border-color: var(--err); }
    .thumb.dragging { opacity: 0.4; }
    .thumb.drop-above { box-shadow: 0 -3px 0 0 var(--accent) inset; }
    .thumb.drop-below { box-shadow: 0 3px 0 0 var(--accent) inset; }
    .thumb .badge-doc {
      position: absolute;
      top: 4px; left: 4px;
      background: rgba(15,23,42,0.85);
      color: var(--accent);
      border: 1px solid var(--accent);
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      pointer-events: none;
    }

    .insert-bar {
      height: 8px;
      margin: -4px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, height 0.15s, margin 0.15s;
      position: relative;
    }
    .insert-bar:hover, .insert-bar.busy {
      opacity: 1;
      height: 24px;
      margin: 0;
    }
    .insert-bar::before {
      content: '';
      position: absolute;
      left: 0; right: 0; top: 50%;
      height: 2px;
      background: var(--accent);
      transform: translateY(-50%);
    }
    .insert-bar .chip {
      position: relative;
      background: var(--accent);
      color: #0f172a;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      z-index: 1;
    }

    .thumbs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 4px 10px;
      font-size: 11px;
      color: var(--muted);
    }
    .thumbs-header button {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 11px;
      padding: 0;
    }
    .thumbs-header button:hover { color: var(--accent-hover); text-decoration: underline; }
    .thumbs-header button:disabled { color: var(--muted); cursor: not-allowed; text-decoration: none; }

    .preview {
      overflow: auto;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .preview canvas {
      background: white;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      max-width: 100%;
      height: auto;
    }
    .preview .placeholder {
      color: var(--muted);
      align-self: center;
    }

    .controls {
      border-left: 1px solid var(--border);
      background: rgba(15,23,42,0.5);
      padding: 20px;
      overflow-y: auto;
    }
    .controls h2 { margin: 0 0 4px; font-size: 15px; }
    .controls .file-info {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 16px;
      word-break: break-all;
    }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .row { display: flex; gap: 8px; align-items: stretch; margin-bottom: 16px; }
    input[type=number], select {
      flex: 1;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      min-width: 0;
    }
    input[type=number]:focus, select:focus { border-color: var(--accent); }
    select { flex: 0 0 80px; }
    button.primary, button.secondary {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: #0f172a; }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }
    button.secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    button.primary:disabled, button.secondary:disabled { opacity: 0.5; cursor: not-allowed; }
    .edit-status {
      font-size: 11px;
      color: var(--warn);
      margin-bottom: 10px;
      min-height: 14px;
    }

    .result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px solid var(--border);
      font-size: 12px;
      display: none;
    }
    .result.show { display: block; }
    .result.err { border-color: var(--err); }
    .result .stat { display: flex; justify-content: space-between; padding: 3px 0; }
    .result .stat span:first-child { color: var(--muted); }
    .saved-path {
      display: block;
      margin-top: 10px;
      padding: 8px 10px;
      background: rgba(74, 222, 128, 0.08);
      border: 1px solid rgba(74, 222, 128, 0.3);
      color: var(--ok);
      border-radius: 6px;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 11px;
      word-break: break-all;
    }
    .reveal {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 9px;
      text-align: center;
      background: var(--ok);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .reveal:hover { filter: brightness(1.05); }
    .mode-toggle {
      display: flex;
      gap: 4px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 6px;
    }
    .mode-btn {
      flex: 1;
      padding: 7px 8px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .mode-btn:hover { color: var(--text); }
    .mode-btn.active { background: var(--accent); color: #0f172a; font-weight: 600; }
    .mode-hint { font-size: 11px; color: var(--muted); margin-bottom: 16px; }

    .progress { margin-top: 12px; }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s;
    }
    .progress-label {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-bottom: 6px; }
    .badge.ok { background: var(--ok); color: #0f172a; }
    .badge.warn { background: var(--warn); color: #0f172a; }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #0f172a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }

    @media (max-width: 900px) {
      .viewer { grid-template-columns: 140px 1fr; }
      .controls { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>PDF Compressor</h1>
        <div class="subtitle" id="headerSubtitle">Upload a PDF to get started</div>
        <div class="subtitle" title="Set PDF_TOOL_OUTPUT_DIR to change">Saves to: <code>{{ output_dir }}</code></div>
      </div>
      <div class="header-actions">
        <button class="ghost-btn hidden" id="changeFileBtn" type="button">Change file</button>
      </div>
    </header>

    <!-- Initial uploader -->
    <div class="uploader" id="uploader">
      <div class="card">
        <label class="drop" id="drop" for="file">
          <div style="font-size:42px;margin-bottom:8px">📄</div>
          <div>Drop a PDF here or <strong>browse</strong></div>
          <div style="color:var(--muted);font-size:12px;margin-top:8px">Max 200 MB</div>
          <input type="file" id="file" accept="application/pdf" />
        </label>
      </div>
    </div>

    <!-- Viewer (hidden until PDF loaded) -->
    <div class="viewer hidden" id="viewer">
      <aside class="thumbs">
        <div class="thumbs-header">
          <span id="pageCount">0 pages</span>
          <button id="resetBtn" type="button" disabled>Reset</button>
        </div>
        <div id="thumbs"></div>
      </aside>
      <main class="preview" id="preview">
        <div class="placeholder">Loading preview…</div>
      </main>
      <aside class="controls">
        <h2>Output</h2>
        <div class="file-info" id="fileInfo"></div>
        <div class="edit-status" id="editStatus"></div>

        <button class="secondary" id="downloadAsIs" type="button">Save as-is</button>

        <label for="size">Target size</label>
        <div class="row">
          <input type="number" id="size" min="1" step="1" value="500" />
          <select id="unit">
            <option value="KB" selected>KB</option>
            <option value="MB">MB</option>
          </select>
        </div>

        <label>Mode</label>
        <div class="mode-toggle" role="tablist">
          <button type="button" class="mode-btn active" data-mode="server">Server</button>
          <button type="button" class="mode-btn" data-mode="client">In-browser</button>
        </div>
        <div class="mode-hint" id="modeHint">Uploads to the server for compression.</div>

        <button class="primary" id="submit" type="button">Compress</button>
        <div class="progress hidden" id="progress">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-label" id="progressLabel">Preparing…</div>
        </div>
        <div class="result" id="result"></div>
      </aside>
    </div>
  </div>

  <!-- Hidden file input used by the "Insert here" bars -->
  <input type="file" id="insertFile" accept="application/pdf,image/jpeg,image/png" style="display:none" />

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <!-- pdf-lib (used for in-browser compression) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

  <script>
    const fileInput = document.getElementById('file');
    const drop = document.getElementById('drop');
    const uploader = document.getElementById('uploader');
    const viewer = document.getElementById('viewer');
    const thumbsEl = document.getElementById('thumbs');
    const previewEl = document.getElementById('preview');
    const fileInfoEl = document.getElementById('fileInfo');
    const headerSubtitle = document.getElementById('headerSubtitle');
    const changeFileBtn = document.getElementById('changeFileBtn');
    const submit = document.getElementById('submit');
    const downloadAsIsBtn = document.getElementById('downloadAsIs');
    const insertFileInput = document.getElementById('insertFile');
    const resetBtn = document.getElementById('resetBtn');
    const pageCountEl = document.getElementById('pageCount');
    const editStatusEl = document.getElementById('editStatus');
    const result = document.getElementById('result');
    const progress = document.getElementById('progress');
    const progressFill = document.getElementById('progressFill');
    const progressLabel = document.getElementById('progressLabel');
    const modeHint = document.getElementById('modeHint');
    const modeBtns = document.querySelectorAll('.mode-btn');

    let mode = 'server';

    // Multi-document state. docs[0] is the original upload; subsequent entries are inserted PDFs.
    // pageOrder is a list of {doc, page} refs giving the final page sequence.
    const docs = [];                     // [{pdf: PDFDocumentProxy, bytes: Uint8Array, name: string}]
    let pageOrder = [];                  // [{doc, page}]
    let originalPageCount = 0;
    let currentRef = null;               // {doc, page} currently shown in the main preview
    const thumbCache = new Map();        // "doc:page" -> thumb element
    const refKey = (r) => `${r.doc}:${r.page}`;
    let pendingInsertIndex = null;       // pageOrder index where the next inserted PDF should land

    modeBtns.forEach(btn => btn.addEventListener('click', () => {
      mode = btn.dataset.mode;
      modeBtns.forEach(b => b.classList.toggle('active', b === btn));
      modeHint.textContent = mode === 'server'
        ? 'Uploads to the server for compression.'
        : 'Runs entirely in your browser — file is never uploaded.';
    }));

    let currentFile = null;
    let renderTask = null;        // in-flight RenderTask for the main preview

    const fmt = (b) => {
      if (b < 1024) return b + ' B';
      if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
      return (b/1024/1024).toFixed(2) + ' MB';
    };

    // --- File picking ---
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });
    ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => {
      e.preventDefault(); drop.classList.add('drag');
    }));
    ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
      e.preventDefault(); drop.classList.remove('drag');
    }));
    drop.addEventListener('drop', e => {
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    changeFileBtn.addEventListener('click', () => {
      currentFile = null;
      docs.length = 0;
      pageOrder = [];
      originalPageCount = 0;
      currentRef = null;
      thumbCache.clear();
      thumbsEl.innerHTML = '';
      previewEl.innerHTML = '<div class="placeholder">Loading preview…</div>';
      result.className = 'result';
      result.innerHTML = '';
      viewer.classList.add('hidden');
      uploader.classList.remove('hidden');
      changeFileBtn.classList.add('hidden');
      headerSubtitle.textContent = 'Upload a PDF to get started';
      fileInput.value = '';
      updateEditStatus();
    });

    resetBtn.addEventListener('click', () => {
      if (!docs[0]) return;
      // Drop any inserted documents and restore the original order from docs[0].
      docs.length = 1;
      // Purge cached thumbs for non-zero docs.
      for (const k of Array.from(thumbCache.keys())) {
        if (!k.startsWith('0:')) thumbCache.delete(k);
      }
      pageOrder = Array.from({ length: originalPageCount }, (_, i) => ({ doc: 0, page: i + 1 }));
      if (!currentRef || currentRef.doc !== 0 || currentRef.page > originalPageCount) {
        currentRef = pageOrder[0];
      }
      rebuildThumbList();
      renderMainPage(currentRef);
      updateEditStatus();
    });

    function hasInsertedDocs() { return docs.length > 1; }

    function isOrderChanged() {
      if (pageOrder.length !== originalPageCount) return true;
      for (let i = 0; i < pageOrder.length; i++) {
        const r = pageOrder[i];
        if (r.doc !== 0 || r.page !== i + 1) return true;
      }
      return false;
    }

    function isEdited() {
      return hasInsertedDocs() || isOrderChanged();
    }

    function updateEditStatus() {
      const edited = isEdited();
      const total = pageOrder.length;
      pageCountEl.textContent = `${total} page${total === 1 ? '' : 's'}`;
      resetBtn.disabled = !edited;
      if (!edited) {
        editStatusEl.textContent = '';
      } else if (hasInsertedDocs()) {
        const inserted = pageOrder.filter(r => r.doc !== 0).length;
        editStatusEl.textContent = `Pages edited — ${inserted} inserted page${inserted === 1 ? '' : 's'}.`;
      } else {
        editStatusEl.textContent = 'Pages edited — output reflects new order.';
      }
    }

    async function handleFile(file) {
      if (!file.name.toLowerCase().endsWith('.pdf')) {
        alert('Please choose a PDF file.');
        return;
      }
      currentFile = file;
      fileInfoEl.textContent = `${file.name} · ${fmt(file.size)}`;
      headerSubtitle.textContent = file.name;

      uploader.classList.add('hidden');
      viewer.classList.remove('hidden');
      changeFileBtn.classList.remove('hidden');

      try {
        const docEntry = await loadDoc(file);
        docs.length = 0;
        docs.push(docEntry);
      } catch (err) {
        previewEl.innerHTML = `<div class="placeholder" style="color:var(--err)">Failed to load PDF: ${err.message}</div>`;
        return;
      }

      originalPageCount = docs[0].pdf.numPages;
      pageOrder = Array.from({ length: originalPageCount }, (_, i) => ({ doc: 0, page: i + 1 }));
      await renderDocThumbnails(0);
      rebuildThumbList();
      currentRef = pageOrder[0];
      await renderMainPage(currentRef);
      updateEditStatus();
    }

    async function loadDoc(file) {
      const buf = await file.arrayBuffer();
      return loadDocFromBytes(new Uint8Array(buf), file.name);
    }

    async function loadDocFromBytes(bytes, name) {
      // getDocument owns the buffer it's given — pass a clone so we can keep `bytes` for pdf-lib.
      const pdf = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
      return { pdf, bytes, name };
    }

    // Wrap an inserted image in a single-page PDF so it flows through the
    // existing PDF-only insert/thumbnail/compress paths unchanged.
    async function imageFileToPdfBytes(file) {
      if (typeof PDFLib === 'undefined') throw new Error('pdf-lib failed to load');
      const bytes = new Uint8Array(await file.arrayBuffer());
      const lower = file.name.toLowerCase();
      const isPng = lower.endsWith('.png') || file.type === 'image/png';
      const isJpg = lower.endsWith('.jpg') || lower.endsWith('.jpeg') || file.type === 'image/jpeg';
      if (!isPng && !isJpg) throw new Error('Unsupported image type');

      const newDoc = await PDFLib.PDFDocument.create();
      const img = isPng ? await newDoc.embedPng(bytes) : await newDoc.embedJpg(bytes);

      // Match the first original page's size when available so inserts feel
      // consistent; otherwise fall back to Letter, oriented to the image.
      let pageW, pageH;
      if (docs[0] && docs[0].pdf.numPages > 0) {
        const p = await docs[0].pdf.getPage(1);
        const vp = p.getViewport({ scale: 1 });
        pageW = vp.width;
        pageH = vp.height;
      } else {
        const landscape = img.width > img.height;
        pageW = landscape ? 792 : 612;
        pageH = landscape ? 612 : 792;
      }

      const scale = Math.min(pageW / img.width, pageH / img.height);
      const drawW = img.width * scale;
      const drawH = img.height * scale;
      const page = newDoc.addPage([pageW, pageH]);
      page.drawImage(img, {
        x: (pageW - drawW) / 2,
        y: (pageH - drawH) / 2,
        width: drawW,
        height: drawH,
      });
      return await newDoc.save({ useObjectStreams: true });
    }

    // Render thumb canvases for every page of docs[docIdx], cache them, but do not append to DOM.
    async function renderDocThumbnails(docIdx) {
      const entry = docs[docIdx];
      const total = entry.pdf.numPages;
      for (let p = 1; p <= total; p++) {
        const ref = { doc: docIdx, page: p };
        const wrap = buildThumbElement(ref);
        thumbCache.set(refKey(ref), wrap);

        try {
          const page = await entry.pdf.getPage(p);
          const baseViewport = page.getViewport({ scale: 1 });
          const targetWidth = 170;
          const scale = targetWidth / baseViewport.width;
          const viewport = page.getViewport({ scale });
          const canvas = wrap.querySelector('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        } catch (err) {
          console.error('thumbnail render failed for', refKey(ref), err);
        }
      }
    }

    function buildThumbElement(ref) {
      const wrap = document.createElement('div');
      wrap.className = 'thumb';
      wrap.dataset.ref = refKey(ref);
      wrap.draggable = true;

      const canvas = document.createElement('canvas');
      wrap.appendChild(canvas);

      const label = document.createElement('div');
      label.className = 'label';
      wrap.appendChild(label);

      if (ref.doc !== 0) {
        const badge = document.createElement('div');
        badge.className = 'badge-doc';
        badge.textContent = `+${ref.doc}`;
        badge.title = docs[ref.doc] ? `Inserted from ${docs[ref.doc].name}` : 'Inserted page';
        wrap.appendChild(badge);
      }

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.title = 'Remove page';
      del.textContent = '×';
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        deletePageAt(wrap.dataset.ref);
      });
      wrap.appendChild(del);

      wrap.addEventListener('click', () => selectPage(ref));

      // Drag-and-drop reordering
      wrap.addEventListener('dragstart', (e) => {
        wrap.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', wrap.dataset.ref);
      });
      wrap.addEventListener('dragend', () => {
        wrap.classList.remove('dragging');
        clearDropIndicators();
      });
      wrap.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const rect = wrap.getBoundingClientRect();
        const above = (e.clientY - rect.top) < rect.height / 2;
        clearDropIndicators();
        wrap.classList.add(above ? 'drop-above' : 'drop-below');
      });
      wrap.addEventListener('dragleave', () => {
        wrap.classList.remove('drop-above', 'drop-below');
      });
      wrap.addEventListener('drop', (e) => {
        e.preventDefault();
        const draggedKey = e.dataTransfer.getData('text/plain');
        if (!draggedKey || draggedKey === wrap.dataset.ref) {
          clearDropIndicators();
          return;
        }
        const rect = wrap.getBoundingClientRect();
        const above = (e.clientY - rect.top) < rect.height / 2;
        movePageByKey(draggedKey, wrap.dataset.ref, above);
        clearDropIndicators();
      });

      return wrap;
    }

    function clearDropIndicators() {
      document.querySelectorAll('.thumb.drop-above, .thumb.drop-below')
        .forEach(el => el.classList.remove('drop-above', 'drop-below'));
    }

    function makeInsertBar(insertIndex) {
      const bar = document.createElement('div');
      bar.className = 'insert-bar';
      bar.title = 'Insert PDF or image here';
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = '+ Insert PDF / image';
      bar.appendChild(chip);
      bar.addEventListener('click', () => triggerInsert(insertIndex));
      return bar;
    }

    function rebuildThumbList() {
      thumbsEl.innerHTML = '';
      thumbsEl.appendChild(makeInsertBar(0));
      pageOrder.forEach((ref, idx) => {
        const el = thumbCache.get(refKey(ref));
        if (!el) return;
        el.querySelector('.label').textContent = `Page ${idx + 1}`;
        el.classList.toggle('active', currentRef && refKey(ref) === refKey(currentRef));
        thumbsEl.appendChild(el);
        thumbsEl.appendChild(makeInsertBar(idx + 1));
      });
    }

    function deletePageAt(key) {
      if (pageOrder.length <= 1) {
        alert("Can't delete the last remaining page.");
        return;
      }
      const idx = pageOrder.findIndex(r => refKey(r) === key);
      if (idx === -1) return;
      const removed = pageOrder.splice(idx, 1)[0];
      if (currentRef && refKey(removed) === refKey(currentRef)) {
        currentRef = pageOrder[Math.min(idx, pageOrder.length - 1)];
        renderMainPage(currentRef);
      }
      rebuildThumbList();
      updateEditStatus();
    }

    function movePageByKey(draggedKey, targetKey, insertAbove) {
      const from = pageOrder.findIndex(r => refKey(r) === draggedKey);
      if (from === -1) return;
      const [ref] = pageOrder.splice(from, 1);
      let to = pageOrder.findIndex(r => refKey(r) === targetKey);
      if (to === -1) return;
      if (!insertAbove) to += 1;
      pageOrder.splice(to, 0, ref);
      rebuildThumbList();
      updateEditStatus();
    }

    async function selectPage(ref) {
      if (currentRef && refKey(ref) === refKey(currentRef)) return;
      currentRef = ref;
      const key = refKey(ref);
      document.querySelectorAll('.thumb').forEach(el => {
        el.classList.toggle('active', el.dataset.ref === key);
      });
      const active = document.querySelector('.thumb.active');
      if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      await renderMainPage(ref);
    }

    // --- Insert PDF ---
    function triggerInsert(insertIndex) {
      pendingInsertIndex = insertIndex;
      insertFileInput.value = '';
      insertFileInput.click();
    }

    insertFileInput.addEventListener('change', async () => {
      const file = insertFileInput.files[0];
      if (!file) return;
      const lower = file.name.toLowerCase();
      const isPdf = lower.endsWith('.pdf');
      const isImg = /\.(jpe?g|png)$/.test(lower)
        || file.type === 'image/jpeg' || file.type === 'image/png';
      if (!isPdf && !isImg) {
        alert('Please choose a PDF, JPG, or PNG file.');
        return;
      }
      if (pendingInsertIndex == null) return;
      const insertAt = pendingInsertIndex;
      pendingInsertIndex = null;

      try {
        let entry;
        if (isPdf) {
          entry = await loadDoc(file);
        } else {
          const pdfBytes = await imageFileToPdfBytes(file);
          entry = await loadDocFromBytes(pdfBytes, file.name);
        }
        const docIdx = docs.length;
        docs.push(entry);
        await renderDocThumbnails(docIdx);
        const newRefs = Array.from({ length: entry.pdf.numPages }, (_, i) => ({ doc: docIdx, page: i + 1 }));
        pageOrder.splice(insertAt, 0, ...newRefs);
        rebuildThumbList();
        updateEditStatus();
        // Focus the first newly-inserted page so the user can see it landed.
        if (newRefs.length) {
          await selectPage(newRefs[0]);
        }
      } catch (err) {
        alert(`Failed to load inserted PDF: ${err.message}`);
      }
    });

    async function renderMainPage(ref) {
      if (renderTask) {
        try { renderTask.cancel(); } catch (e) {}
        renderTask = null;
      }
      if (!ref || !docs[ref.doc]) return;
      const page = await docs[ref.doc].pdf.getPage(ref.page);
      const containerWidth = previewEl.clientWidth - 48; // account for padding
      const containerHeight = previewEl.clientHeight - 48;
      const baseViewport = page.getViewport({ scale: 1 });
      const scale = Math.min(
        containerWidth / baseViewport.width,
        containerHeight / baseViewport.height,
        2.5
      );
      const viewport = page.getViewport({ scale: Math.max(scale, 0.5) });

      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');

      previewEl.innerHTML = '';
      previewEl.appendChild(canvas);

      renderTask = page.render({ canvasContext: ctx, viewport });
      try {
        await renderTask.promise;
      } catch (err) {
        if (err && err.name !== 'RenderingCancelledException') console.error(err);
      } finally {
        renderTask = null;
      }
    }

    // Re-render the main page on resize so it stays sharp.
    let resizeTimer;
    window.addEventListener('resize', () => {
      if (!currentRef) return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => renderMainPage(currentRef), 150);
    });

    // --- Compression ---
    const PRESETS = [
      { dpi: 200, q: 0.85 },
      { dpi: 180, q: 0.80 },
      { dpi: 150, q: 0.75 },
      { dpi: 130, q: 0.70 },
      { dpi: 110, q: 0.60 },
      { dpi: 96,  q: 0.55 },
      { dpi: 85,  q: 0.50 },
      { dpi: 75,  q: 0.45 },
      { dpi: 65,  q: 0.40 },
      { dpi: 55,  q: 0.35 },
      { dpi: 45,  q: 0.30 },
      { dpi: 36,  q: 0.25 },
    ];

    function setProgress(pct, label) {
      progress.classList.remove('hidden');
      progressFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
      if (label) progressLabel.textContent = label;
    }
    function hideProgress() {
      progress.classList.add('hidden');
      progressFill.style.width = '0%';
    }

    function canvasToJpegBytes(canvas, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(async blob => {
          if (!blob) return reject(new Error('Canvas encoding failed'));
          resolve(new Uint8Array(await blob.arrayBuffer()));
        }, 'image/jpeg', quality);
      });
    }

    // Render every page (in pageOrder) at given DPI/quality and assemble a new PDF with pdf-lib.
    async function buildPdfAtPreset(preset, onPageProgress) {
      const { dpi, q } = preset;
      const scale = dpi / 72;
      const order = pageOrder.slice();
      const numPages = order.length;
      const newDoc = await PDFLib.PDFDocument.create();

      for (let i = 0; i < numPages; i++) {
        const ref = order[i];
        const page = await docs[ref.doc].pdf.getPage(ref.page);
        const baseViewport = page.getViewport({ scale: 1 });   // points (72-DPI)
        const viewport = page.getViewport({ scale });

        const canvas = document.createElement('canvas');
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        const ctx = canvas.getContext('2d');
        // White background — JPEG has no alpha, and PDF.js leaves it transparent.
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        await page.render({ canvasContext: ctx, viewport }).promise;

        const jpegBytes = await canvasToJpegBytes(canvas, q);
        const jpeg = await newDoc.embedJpg(jpegBytes);

        const newPage = newDoc.addPage([baseViewport.width, baseViewport.height]);
        newPage.drawImage(jpeg, {
          x: 0, y: 0,
          width: baseViewport.width,
          height: baseViewport.height,
        });

        // Free memory before next page.
        canvas.width = canvas.height = 0;

        if (onPageProgress) onPageProgress(i + 1, numPages);
        // Yield to the UI thread so the progress bar can repaint.
        await new Promise(r => setTimeout(r, 0));
      }

      return await newDoc.save({ useObjectStreams: true });
    }

    async function compressClientSide(targetBytes) {
      let best = null;
      for (let p = 0; p < PRESETS.length; p++) {
        const preset = PRESETS[p];
        const presetLabel = `dpi=${preset.dpi}, q=${(preset.q * 100).toFixed(0)}`;
        setProgress((p / PRESETS.length) * 100, `Trying ${presetLabel}…`);

        const bytes = await buildPdfAtPreset(preset, (page, total) => {
          const presetSpan = 100 / PRESETS.length;
          const pageFrac = page / total;
          setProgress(p * presetSpan + presetSpan * pageFrac,
            `Trying ${presetLabel} · page ${page}/${total}`);
        });

        best = { bytes, preset: presetLabel, size: bytes.byteLength };
        if (bytes.byteLength <= targetBytes) {
          return { ...best, reachedTarget: true };
        }
      }
      return { ...best, reachedTarget: false, preset: best.preset + ' (target not reached)' };
    }

    async function runServerCompress(targetKb) {
      const data = new FormData();
      if (hasInsertedDocs()) {
        // Inserts can't be expressed as a simple page_order; merge client-side first.
        const mergedBytes = await buildReorganizedPdfBytes();
        const mergedBlob = new Blob([mergedBytes], { type: 'application/pdf' });
        const base = currentFile.name.replace(/\.pdf$/i, '');
        data.append('pdf', mergedBlob, `${base}-merged.pdf`);
      } else {
        data.append('pdf', currentFile);
        if (isOrderChanged()) data.append('page_order', JSON.stringify(pageOrder.map(r => r.page)));
      }
      data.append('target_kb', targetKb);
      const res = await fetch('/compress', { method: 'POST', body: data });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || 'Compression failed');
      // Show the truly-original size, not the size of the merged intermediate we may have sent.
      const originalSize = hasInsertedDocs()
        ? docs.reduce((sum, d) => sum + d.bytes.byteLength, 0)
        : json.original_size;
      return {
        originalSize,
        finalSize: json.final_size,
        targetBytes: json.target_bytes,
        preset: json.preset,
        reachedTarget: json.reached_target,
        savedPath: json.saved_path,
        savedName: json.saved_name,
      };
    }

    async function saveBytesToOutput(bytes, name) {
      const data = new FormData();
      const blob = new Blob([bytes], { type: 'application/pdf' });
      data.append('pdf', blob, name);
      const res = await fetch('/save', { method: 'POST', body: data });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || 'Save failed');
      return json; // { saved_path, saved_name, size }
    }

    async function revealInFolder(path) {
      try {
        await fetch('/reveal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path }),
        });
      } catch (err) {
        console.error('reveal failed', err);
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    // --- Download as-is (lossless: original PDF or reorganized/merged via pdf-lib copyPages) ---
    async function buildReorganizedPdfBytes() {
      if (typeof PDFLib === 'undefined') throw new Error('pdf-lib failed to load');
      // Load each unique source doc into pdf-lib once.
      const srcDocCache = new Map();   // docIdx -> pdf-lib PDFDocument
      async function getSrcDoc(docIdx) {
        if (srcDocCache.has(docIdx)) return srcDocCache.get(docIdx);
        const d = await PDFLib.PDFDocument.load(docs[docIdx].bytes.slice());
        srcDocCache.set(docIdx, d);
        return d;
      }
      // Batch copyPages calls per source doc, preserving final order.
      const groups = []; // [{docIdx, indices: [pageIndex], outPositions: [finalIdx]}]
      let last = null;
      for (let i = 0; i < pageOrder.length; i++) {
        const r = pageOrder[i];
        if (!last || last.docIdx !== r.doc) {
          last = { docIdx: r.doc, indices: [], outPositions: [] };
          groups.push(last);
        }
        last.indices.push(r.page - 1);
        last.outPositions.push(i);
      }
      const newDoc = await PDFLib.PDFDocument.create();
      const finalPages = new Array(pageOrder.length);
      for (const g of groups) {
        const src = await getSrcDoc(g.docIdx);
        const copied = await newDoc.copyPages(src, g.indices);
        copied.forEach((page, k) => { finalPages[g.outPositions[k]] = page; });
      }
      finalPages.forEach(p => newDoc.addPage(p));
      return await newDoc.save({ useObjectStreams: true });
    }

    downloadAsIsBtn.addEventListener('click', async () => {
      if (!currentFile) return;
      downloadAsIsBtn.disabled = true;
      const originalLabel = downloadAsIsBtn.textContent;
      downloadAsIsBtn.innerHTML = '<span class="spinner"></span>Saving…';
      result.className = 'result';
      try {
        let bytes, name;
        const base = currentFile.name.replace(/\.pdf$/i, '');
        if (!isEdited()) {
          bytes = docs[0].bytes;
          name = currentFile.name;
        } else {
          bytes = await buildReorganizedPdfBytes();
          name = `${base}-${hasInsertedDocs() ? 'merged' : 'reorganized'}.pdf`;
        }
        const saved = await saveBytesToOutput(bytes, name);
        result.innerHTML = `
          <span class="badge ok">Saved</span>
          <div class="stat"><span>File</span><span>${escapeHtml(saved.saved_name)}</span></div>
          <div class="stat"><span>Size</span><span>${fmt(saved.size)}</span></div>
          <code class="saved-path">${escapeHtml(saved.saved_path)}</code>
          <button class="reveal" type="button" data-path="${escapeHtml(saved.saved_path)}">Show in folder</button>
        `;
        result.classList.add('show');
      } catch (err) {
        result.className = 'result show err';
        result.innerHTML = `<strong style="color:var(--err)">Error:</strong> ${escapeHtml(err.message)}`;
      } finally {
        downloadAsIsBtn.disabled = false;
        downloadAsIsBtn.textContent = originalLabel;
      }
    });

    // Delegated handler for the dynamically-rendered "Show in folder" button.
    result.addEventListener('click', (e) => {
      const btn = e.target.closest('.reveal');
      if (btn && btn.dataset.path) revealInFolder(btn.dataset.path);
    });

    submit.addEventListener('click', async () => {
      if (!currentFile) return;
      const size = parseFloat(document.getElementById('size').value);
      const unit = document.getElementById('unit').value;
      if (!size || size <= 0) {
        result.className = 'result show err';
        result.innerHTML = '<strong style="color:var(--err)">Error:</strong> Enter a valid target size';
        return;
      }
      const targetKb = unit === 'MB' ? size * 1024 : size;
      const targetBytes = Math.round(targetKb * 1024);

      submit.disabled = true;
      submit.innerHTML = '<span class="spinner"></span>Compressing…';
      result.className = 'result';

      try {
        let out;
        if (mode === 'server') {
          out = await runServerCompress(targetKb);
        } else {
          if (!docs[0]) throw new Error('PDF not loaded yet');
          if (typeof PDFLib === 'undefined') throw new Error('pdf-lib failed to load');
          setProgress(0, 'Starting…');
          const r = await compressClientSide(targetBytes);
          const base = currentFile.name.replace(/\.pdf$/i, '');
          setProgress(100, 'Saving…');
          const saved = await saveBytesToOutput(r.bytes, `${base}-compressed.pdf`);
          out = {
            originalSize: currentFile.size,
            finalSize: r.size,
            targetBytes,
            preset: r.preset,
            reachedTarget: r.reachedTarget,
            savedPath: saved.saved_path,
            savedName: saved.saved_name,
          };
        }

        const badge = out.reachedTarget
          ? '<span class="badge ok">Target reached</span>'
          : '<span class="badge warn">Best effort</span>';
        const ratio = ((1 - out.finalSize / out.originalSize) * 100).toFixed(1);

        result.innerHTML = `
          ${badge}
          <div class="stat"><span>Original</span><span>${fmt(out.originalSize)}</span></div>
          <div class="stat"><span>Target</span><span>${fmt(out.targetBytes)}</span></div>
          <div class="stat"><span>Final</span><span>${fmt(out.finalSize)} (-${ratio}%)</span></div>
          <div class="stat"><span>Preset</span><span>${escapeHtml(out.preset)}</span></div>
          <div class="stat"><span>Mode</span><span>${mode === 'server' ? 'Server' : 'In-browser'}</span></div>
          <div class="stat"><span>File</span><span>${escapeHtml(out.savedName)}</span></div>
          <code class="saved-path">${escapeHtml(out.savedPath)}</code>
          <button class="reveal" type="button" data-path="${escapeHtml(out.savedPath)}">Show in folder</button>
        `;
        result.classList.add('show');
      } catch (err) {
        result.className = 'result show err';
        result.innerHTML = `<strong style="color:var(--err)">Error:</strong> ${escapeHtml(err.message)}`;
      } finally {
        submit.disabled = false;
        submit.textContent = 'Compress';
        hideProgress();
      }
    });
  </script>
</body>
</html>
