<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PDF Smith</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="tool.css" />
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>PDF Smith</h1>
        <div class="subtitle" id="headerSubtitle">Upload a PDF to get started</div>
        <div class="subtitle">Saves via your browser's downloads folder</div>
      </div>
      <div class="header-actions">
        <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="anamsimon" data-color="#FFDD00" data-emoji="☕" data-font="Poppins" data-text="Buy me a coffee" data-outline-color="#000000" data-font-color="#000000" data-coffee-color="#ffffff"></script>
        <button class="ghost-btn hidden" id="changeFileBtn" type="button">Close file</button>
      </div>
    </header>

    <div class="uploader" id="uploader">
      <div class="card">
        <label class="drop" id="drop" for="file">
          <div style="font-size:42px;margin-bottom:8px">📄</div>
          <div>Drop a File (PDF or Image) or <strong>browse</strong></div>
          <div style="color:var(--muted);font-size:12px;margin-top:8px">Runs entirely in your browser</div>
          <input type="file" id="file" accept="application/pdf,image/jpeg,image/png" multiple />
        </label>
      </div>
    </div>

    <div class="viewer hidden" id="viewer">
      <aside class="thumbs">
        <div class="thumbs-header">
          <span id="pageCount">0 pages</span>
          <button id="resetBtn" type="button" disabled>Reset</button>
        </div>
        <div id="thumbs"></div>
      </aside>
      <div class="preview-col">
        <main class="preview" id="preview">
          <div class="placeholder">Loading preview…</div>
        </main>
        <div class="zoom-bar" id="zoomBar">
          <button class="zoom-btn" id="zoomOutBtn" type="button" title="Zoom out">−</button>
          <span id="zoomLabel">100%</span>
          <button class="zoom-btn" id="zoomInBtn" type="button" title="Zoom in">+</button>
          <span class="zoom-sep"></span>
          <button class="zoom-btn" id="textModeBtn" type="button" title="Add text to page">T</button>
          <span class="zoom-sep"></span>
          <button class="zoom-btn" id="undoBtn" type="button" title="Undo (Ctrl+Z)" disabled>↶</button>
          <button class="zoom-btn" id="redoBtn" type="button" title="Redo (Ctrl+Y)" disabled>↷</button>
        </div>
      </div>
      <aside class="controls">
        <h2>Output</h2>
        <div class="file-info" id="fileInfo"></div>
        <div class="edit-status" id="editStatus"></div>

        <button class="secondary" id="downloadAsIs" type="button">Save as-is</button>

        <label for="size">Target size</label>
        <div class="row">
          <input type="number" id="size" min="1" step="1" value="500" />
          <select id="unit">
            <option value="KB" selected>KB</option>
            <option value="MB">MB</option>
          </select>
        </div>

        <div class="mode-hint" id="modeHint">Compression runs entirely in your browser — the file is never uploaded.</div>

        <button class="primary" id="submit" type="button">Compress &amp; Download</button>
        <div class="progress hidden" id="progress">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-label" id="progressLabel">Preparing…</div>
        </div>
        <div class="result" id="result"></div>
      </aside>
    </div>
  </div>

  <input type="file" id="insertFile" accept="application/pdf,image/jpeg,image/png" multiple style="display:none" />

  <div class="text-panel hidden" id="textPanel">
    <div class="text-panel-head">
      <span>Add Text</span>
      <button class="text-panel-close" id="tpClose" type="button">✕</button>
    </div>
    <div class="text-panel-format">
      <select id="tpFont">
        <option value="Helvetica">Helvetica</option>
        <option value="Times-Roman">Times Roman</option>
        <option value="Courier">Courier</option>
      </select>
      <input type="number" id="tpSize" value="16" min="4" max="400" />
      <button type="button" id="tpBold" class="fmt-btn" title="Bold"><b>B</b></button>
      <button type="button" id="tpItalic" class="fmt-btn" title="Italic"><i>I</i></button>
      <input type="color" id="tpColor" value="#000000" />
    </div>
    <textarea id="tpText" rows="3" placeholder="Type text here…"></textarea>
    <div class="text-panel-hint" id="tpHint">Click on a page to place the text</div>
    <div class="text-panel-actions">
      <button type="button" id="tpAdd" class="primary" disabled>Add</button>
      <button type="button" id="tpCancel" class="secondary">Cancel</button>
    </div>
  </div>

  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="tool.js"></script>
</body>
</html>
